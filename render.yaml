services:
  - type: web
    name: acity-connect-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run db:init && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_EMAILS
        value: elliot.akayete@acity.edu.gh
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: acity-connect-db
          property: connectionString

databases:
  - name: acity-connect-db
    databaseName: acity_connect
    user: acity_connect_user
